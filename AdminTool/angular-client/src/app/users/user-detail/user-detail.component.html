<ng-container *ngIf="loading; else contentTpl">
  <div class="loading">
    <mat-progress-spinner diameter="36" mode="indeterminate"></mat-progress-spinner>
    <span>Loading user...</span>
  </div>
</ng-container>

<ng-template #contentTpl>
  <section class="page" *ngIf="user; else emptyTpl">
    <header class="page-header">
      <div>
        <p class="eyebrow">User detail</p>
        <h1>{{ user!.name }}</h1>
        <p class="sub">{{ user!.email }}</p>
      </div>
      <div class="actions">
        <button mat-stroked-button routerLink="/users">Back</button>
        <button mat-flat-button color="primary" (click)="openEdit()" *ngIf="canEdit">
          Edit
        </button>
        <button mat-flat-button color="warn" (click)="remove()" *ngIf="auth.isAdmin()">
          Delete
        </button>
      </div>
    </header>

    <mat-card class="detail-card">
      <div class="info">
        <div>
          <p class="label">Role</p>
          <p class="value">{{ user!.role }}</p>
        </div>
        <div>
          <p class="label">Created</p>
          <p class="value">{{ datePipe.transform(user!.createdAt, "MMM d, y") }}</p>
        </div>
        <div>
          <p class="label">Updated</p>
          <p class="value">{{ datePipe.transform(user!.updatedAt, "MMM d, y") }}</p>
        </div>
      </div>
    </mat-card>
  </section>
</ng-template>

<ng-template #emptyTpl>
  <section class="page">
    <mat-card class="detail-card">
      <p>User not available.</p>
    </mat-card>
  </section>
</ng-template>

<ng-container *ngIf="loading; else contentTpl">
  <div class="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <span>Loading user...</span>
  </div>
</ng-container>

<ng-template #contentTpl>
  <section class="page" *ngIf="user; else emptyTpl">
    <header class="page-header">
      <div>
        <p class="eyebrow">User detail</p>
        <h1>{{ user!.name }}</h1>
        <p class="sub">{{ user!.email }}</p>
      </div>
      <div class="actions">
        <button class="btn btn-outline-secondary" routerLink="/users">Back</button>
        <button
          class="btn btn-primary"
          (click)="openEdit()"
          data-bs-toggle="modal"
          [attr.data-bs-target]="'#' + editModalId"
          *ngIf="canEdit"
        >
          Edit
        </button>
        <button class="btn btn-danger" (click)="remove()" *ngIf="auth.isAdmin()">Delete</button>
      </div>
    </header>

    <div *ngIf="alertMessage" class="alert" [ngClass]="'alert-' + alertType" role="alert">
      {{ alertMessage }}
    </div>

    <div class="card detail-card">
      <div class="info">
        <div>
          <p class="label">Role</p>
          <p class="value">{{ user!.role }}</p>
        </div>
        <div>
          <p class="label">Created</p>
          <p class="value">{{ datePipe.transform(user!.createdAt, "MMM d, y") }}</p>
        </div>
        <div>
          <p class="label">Updated</p>
          <p class="value">{{ datePipe.transform(user!.updatedAt, "MMM d, y") }}</p>
        </div>
      </div>
    </div>
  </section>
</ng-template>

<ng-template #emptyTpl>
  <section class="page">
    <div class="card detail-card">
      <p>User not available.</p>
    </div>
  </section>
</ng-template>

<app-user-form-dialog
  [modalId]="editModalId"
  [data]="editDialogData"
  (submitted)="handleEditSubmit($event)"
></app-user-form-dialog>

<div class="card grid-card">
  <div class="card-body list-audit-shell">
    <p class="audit-title mb-2">{{ title }}</p>

    <div class="inline-loading" *ngIf="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <span>Loading audit...</span>
    </div>

    <div class="empty-audit" *ngIf="!loading && !items.length">
      {{ emptyMessage }}
    </div>

    <div class="table-responsive" *ngIf="!loading && items.length">
      <table class="table table-sm align-middle mb-0">
        <thead>
          <tr>
            <th>Time (UTC)</th>
            <th>Actor</th>
            <th>Action</th>
            <th>Field</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items">
            <td>{{ datePipe.transform(item.occurredAtUtc, 'MMM d, y, h:mm a') }}</td>
            <td>{{ item.performedBy }}</td>
            <td>{{ item.action }}</td>
            <td>{{ item.field }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="search-query">
  <input
    class="form-control form-control-sm search-input"
    type="search"
    [value]="query"
    [placeholder]="placeholder"
    (input)="onInput($event)"
    aria-label="Search records"
  />
  @if (showOpen) {
    <button
      class="btn btn-primary btn-sm"
      type="button"
      (click)="open()"
      [disabled]="isOpenDisabled"
    >
      Open
    </button>
  }

  <button class="btn btn-outline-secondary btn-sm" type="button" (click)="clear()" [disabled]="!query">Clear</button>

  @if (showRefresh) {
    <button
      class="btn btn-outline-success btn-sm"
      type="button"
      (click)="refresh()"
      [disabled]="refreshDisabled"
    >
      Refresh
    </button>
  }

  <div class="search-actions">
    <ng-content select="[searchActions]"></ng-content>
  </div>
</div>

@if (alertMessage) {
  <div class="alert alert-warning search-alert" role="alert">
    {{ alertMessage }}
  </div>
}

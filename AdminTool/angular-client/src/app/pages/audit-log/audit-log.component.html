<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Administration</p>
      <h1>List Access Audit Logs</h1>
    </div>
  </header>

  @if (alertMessage) {
    <div
      class="alert"
      [ngClass]="'alert-' + alertType"
      animate.enter="alert-enter"
      animate.leave="alert-leave"
      role="alert"
    >
      {{ alertMessage }}
    </div>
  }

  @if (!auth.isAdmin()) {
    <div class="alert alert-warning" role="alert">
      Admin access is required to view list access audit logs.
    </div>
  }

  @if (auth.isAdmin()) {
    <app-audit-log-section
      [items]="auditRows"
      [loading]="loading"
    ></app-audit-log-section>
  }

</section>

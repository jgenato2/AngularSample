<app-state-layout [loading]="loading" [error]="alertMessage" [empty]="!plan && !loading && !alertMessage">
  @if (plan) {
    <section class="page">
    <!-- HEADER -->
    <header class="page-header">
      <div>
        <p class="eyebrow">Insurance detail</p>
        <h1>{{ plan.policyId }}</h1>
        <p class="sub">{{ plan.memberName }} · {{ plan.provider }}</p>
      </div>
      <app-detail-actions-bar (back)="goBack()">
        @if (canManage) {
        <button class="btn btn-danger" (click)="remove()">Delete</button>
        }
      </app-detail-actions-bar>
    </header>
    <!-- TABS -->
    <div class="tab-strip">
      <button class="tab-btn" [class.active]="activeTab === 'details'" (click)="switchTab('details')">
        Plan Details
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'financial'" (click)="switchTab('financial')">
        Financial Algorithm
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'audit'" (click)="switchTab('audit')">
        Audit Log
      </button>
    </div>
    <!-- DETAILS TAB -->
    @if (activeTab === 'details') {

  <div class="snapshot-grid">
    <app-coverage-card [plan]="plan" [memberClaimId]="memberClaimId">
    </app-coverage-card>

    <app-financial-card [plan]="plan">
    </app-financial-card>

    <app-timeline-card [plan]="plan">
    </app-timeline-card>
  </div>

  <div class="card detail-card">

    <form class="form-grid" (ngSubmit)="save()" #detailForm="ngForm">

      <div>
        <label class="form-label">Member name</label>
        <input class="form-control" name="memberName" [(ngModel)]="formModel.memberName" [disabled]="!canManage"
          required />
      </div>

      <div>
        <label class="form-label">Provider</label>

        <input class="form-control" list="provider-options" name="provider" [(ngModel)]="formModel.provider"
          [disabled]="!canManage" required />

        <datalist id="provider-options">
          @for (provider of providerOptions; track provider) {
          <option [value]="provider"></option>
          }
        </datalist>

      </div>

      <div>
        <label class="form-label">Plan type</label>
        <input class="form-control" name="planType" [(ngModel)]="formModel.planType" [disabled]="!canManage" required />
      </div>

      <div>
        <label class="form-label">Status</label>

        <button type="button" class="btn status-trigger" (click)="openStatusModal()" [disabled]="!canManage || saving"
          [ngClass]="statusTagClass(formModel.status)">

          {{ formModel.status || 'Select status' }}

        </button>
      </div>

      <div>
        <label class="form-label">Monthly premium</label>

        <div class="input-group money-input-group">
          <span class="input-group-text">$</span>

          <input type="number" class="form-control" name="monthlyPremium" [(ngModel)]="formModel.monthlyPremium"
            [disabled]="!canManage" min="0" step="0.01" required />
        </div>
      </div>

      <div>
        <label class="form-label">Deductible</label>

        <div class="input-group money-input-group">
          <span class="input-group-text">$</span>

          <input type="number" class="form-control" name="deductible" [(ngModel)]="formModel.deductible"
            [disabled]="!canManage" min="0" step="0.01" required />
        </div>
      </div>

      <div>
        <label class="form-label">Out-of-pocket max</label>

        <div class="input-group money-input-group">
          <span class="input-group-text">$</span>

          <input type="number" class="form-control" name="outOfPocketMax" [(ngModel)]="formModel.outOfPocketMax"
            [disabled]="!canManage" min="0" step="0.01" required />
        </div>
      </div>

      <div>
        <label class="form-label">Effective date</label>

        <input type="date" class="form-control" name="effectiveDate" [(ngModel)]="formModel.effectiveDate"
          [disabled]="!canManage" required />
      </div>

      <div>
        <label class="form-label">Renewal date</label>

        <input type="date" class="form-control" name="renewalDate" [(ngModel)]="formModel.renewalDate"
          [disabled]="!canManage" required />
      </div>

      <div class="full-row">
        <label class="form-label">Comments</label>

        <textarea class="form-control" rows="3" name="comments" [(ngModel)]="formModel.comments"
          [disabled]="!canManage">
        </textarea>
      </div>

      @if (canManage) {
      <div class="full-row actions">

        <button class="btn btn-primary" type="submit" [disabled]="detailForm.invalid || saving">

          {{ saving ? "Saving..." : "Save" }}

        </button>

      </div>
      }

    </form>

  </div>

  }

  <!-- FINANCIAL TAB -->
  @if (activeTab === 'financial') {

  <div class="algorithm-grid">

    <app-risk-model-card [financial]="financial">
    </app-risk-model-card>

    <app-baseline-projection-card [financial]="financial">
    </app-baseline-projection-card>

    <app-stress-test-card [financial]="financial">
    </app-stress-test-card>

  </div>

  <app-algorithm-notes-card></app-algorithm-notes-card>

  }

  <!-- AUDIT TAB -->
  @if (isAuditTab()) {
    <app-audit-log-section [items]="auditLogs" [loading]="auditLoading">
    </app-audit-log-section>
  }
  </section>
}

<ng-container *ngIf="loading; else contentTpl">
  <div class="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <span>Loading insurance plan...</span>
  </div>
</ng-container>

<ng-template #contentTpl>
  <section class="page" *ngIf="plan; else emptyTpl">
    <header class="page-header">
      <div>
        <p class="eyebrow">Insurance detail</p>
        <h1>{{ plan.policyId }}</h1>
        <p class="sub">{{ plan.memberName }} · {{ plan.provider }}</p>
      </div>
      <app-detail-actions-bar (back)="goBack()">
        <button class="btn btn-danger" (click)="remove()" *ngIf="canManage">Delete</button>
      </app-detail-actions-bar>
    </header>

    <div
      *ngIf="alertMessage"
      class="alert"
      [ngClass]="'alert-' + alertType"
      animate.enter="alert-enter"
      animate.leave="alert-leave"
      role="alert"
    >
      {{ alertMessage }}
    </div>

    <div class="tab-strip" role="tablist" aria-label="Insurance detail tabs">
      <button
        class="tab-btn"
        type="button"
        [class.active]="activeTab === 'details'"
        (click)="switchTab('details')"
      >
        Plan Details
      </button>
      <button
        class="tab-btn"
        type="button"
        [class.active]="activeTab === 'financial'"
        (click)="switchTab('financial')"
      >
        Financial Algorithm
      </button>
      <button
        class="tab-btn"
        type="button"
        [class.active]="activeTab === 'audit'"
        (click)="switchTab('audit')"
      >
        Audit Log
      </button>
    </div>

    <ng-container *ngIf="activeTab === 'details'">
      <div class="snapshot-grid">
        <app-coverage-card [plan]="plan" [memberClaimId]="memberClaimId"></app-coverage-card>
        <app-financial-card [plan]="plan"></app-financial-card>
        <app-timeline-card [plan]="plan"></app-timeline-card>
      </div>

      <div class="card detail-card">
        <form class="form-grid" (ngSubmit)="save()" #detailForm="ngForm">
          <div>
            <label class="form-label">Member name</label>
            <input class="form-control" name="memberName" [(ngModel)]="formModel.memberName" [disabled]="!canManage" required />
          </div>

          <div>
            <label class="form-label">Provider</label>
            <input class="form-control" list="provider-options" name="provider" [(ngModel)]="formModel.provider" [disabled]="!canManage" required />
            <datalist id="provider-options">
              @for (provider of providerOptions; track provider) {
                <option [value]="provider"></option>
              }
            </datalist>
          </div>

          <div>
            <label class="form-label">Plan type</label>
            <input class="form-control" name="planType" [(ngModel)]="formModel.planType" [disabled]="!canManage" required />
          </div>

          <div>
            <label class="form-label">Status</label>
            <button
              type="button"
              class="btn status-trigger"
              [disabled]="!canManage || saving"
              (click)="openStatusModal()"
              [ngClass]="statusTagClass(formModel.status)"
            >
              {{ formModel.status || 'Select status' }}
            </button>
          </div>

          <div>
            <label class="form-label">Monthly premium</label>
            <div class="input-group money-input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control money-input" name="monthlyPremium" [(ngModel)]="formModel.monthlyPremium" [disabled]="!canManage" min="0" step="0.01" inputmode="decimal" required />
            </div>
          </div>

          <div>
            <label class="form-label">Deductible</label>
            <div class="input-group money-input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control money-input" name="deductible" [(ngModel)]="formModel.deductible" [disabled]="!canManage" min="0" step="0.01" inputmode="decimal" required />
            </div>
          </div>

          <div>
            <label class="form-label">Out-of-pocket max</label>
            <div class="input-group money-input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control money-input" name="outOfPocketMax" [(ngModel)]="formModel.outOfPocketMax" [disabled]="!canManage" min="0" step="0.01" inputmode="decimal" required />
            </div>
          </div>

          <div>
            <label class="form-label">Effective date</label>
            <input type="date" class="form-control" name="effectiveDate" [(ngModel)]="formModel.effectiveDate" [disabled]="!canManage" required />
          </div>

          <div>
            <label class="form-label">Renewal date</label>
            <input type="date" class="form-control" name="renewalDate" [(ngModel)]="formModel.renewalDate" [disabled]="!canManage" required />
          </div>

          <div class="full-row">
            <label class="form-label">Comments</label>
            <textarea
              class="form-control"
              name="comments"
              rows="3"
              [(ngModel)]="formModel.comments"
              [disabled]="!canManage"
              placeholder="Add policy notes or remarks"
            ></textarea>
          </div>

          <div class="full-row actions" *ngIf="canManage">
            <button class="btn btn-primary" type="submit" [disabled]="detailForm.invalid || saving">
              {{ saving ? "Saving..." : "Save" }}
            </button>
          </div>
        </form>
      </div>
    </ng-container>

    <div
      class="status-modal-backdrop"
      *ngIf="showStatusModal"
      animate.enter="modal-backdrop-enter"
      animate.leave="modal-backdrop-leave"
      (click)="closeStatusModal()"
    ></div>
    <section
      class="status-modal"
      *ngIf="showStatusModal"
      animate.enter="modal-panel-enter"
      animate.leave="modal-panel-leave"
      role="dialog"
      aria-modal="true"
      aria-label="Select insurance status"
    >
      <header class="status-modal-header">
        <h2>Select Status</h2>
        <button type="button" class="btn-close" aria-label="Close" [disabled]="saving" (click)="closeStatusModal()"></button>
      </header>
      <div class="status-modal-body">
        <button
          *ngFor="let status of availableStatusOptions"
          type="button"
          class="btn status-choice"
          [disabled]="saving"
          [ngClass]="statusTagClass(status)"
          (click)="selectStatus(status)"
        >
          {{ status }}
        </button>
      </div>
    </section>

    <ng-container *ngIf="activeTab === 'financial'">
      <div class="algorithm-grid">
        <app-risk-model-card [financial]="financial"></app-risk-model-card>
        <app-baseline-projection-card [financial]="financial"></app-baseline-projection-card>
        <app-stress-test-card [financial]="financial"></app-stress-test-card>
      </div>

      <app-algorithm-notes-card></app-algorithm-notes-card>
    </ng-container>

    <ng-container *ngIf="activeTab === 'audit'">
      <app-audit-log-section [items]="auditLogs" [loading]="auditLoading"></app-audit-log-section>
    </ng-container>
  </section>
</ng-template>

<ng-template #emptyTpl>
  <section class="page">
    <div class="card detail-card">
      <p>Insurance plan not available.</p>
    </div>
  </section>
</ng-template>

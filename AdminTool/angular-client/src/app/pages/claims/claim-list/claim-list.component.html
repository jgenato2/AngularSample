<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Healthcare module</p>
      <h1>Claims</h1>
    </div>
  </header>

  @if (alertMessage) {
  <div class="alert" [ngClass]="'alert-' + alertType" animate.enter="alert-enter" animate.leave="alert-leave"
    role="alert">
    {{ alertMessage }}
  </div>
  }

  <!-- ADMIN CREATE FORM -->
  @if (auth.isAdmin()) {
  <div id="create-claim-form" class="collapse">
    <div class="card form-card">
      <div class="card-body">
        <form class="form-grid" (ngSubmit)="create()" #createForm="ngForm">
          <!-- form fields unchanged -->
        </form>
      </div>
    </div>
  </div>
  }

  <!-- TOOLBAR -->
  <div class="grid-toolbar">
    <app-search-query [query]="gridSearchQuery" [placeholder]="'Search claims'" [matches]="insuranceSearchMatches"
      [matchIdentity]="insurancePolicyMatchIdentity" [showOpen]="true" [showRefresh]="true"
      [openDisabled]="!gridSearchQuery" [refreshDisabled]="loading" (queryChange)="gridSearchQuery = $event"
      (matchOpened)="onInsuranceSearchMatchOpened($event)" (refreshClicked)="load()"></app-search-query>

    <div class="grid-toolbar-actions">
      @if (auth.isAdmin()) {
      <button class="btn btn-primary add-claim-btn" type="button" data-bs-toggle="collapse"
        data-bs-target="#create-claim-form">
        Add claim
      </button>
      }
    </div>
  </div>

  <!-- GRID -->
  <div class="card grid-card">
    <div class="card-body grid-shell">
      <app-state-layout [loading]="loading" [error]="alertMessage" [empty]="!displayedClaims.length && !loading && !alertMessage">
        <app-data-grid [rows]="displayedClaims" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
          [showSearch]="false" [externalSearchQuery]="gridSearchQuery" (cellClicked)="onCellClicked($event)"
          (gridSortChange)="onGridSortChanged($event)" (rowClicked)="openDetail($event.data)"></app-data-grid>
      </app-state-layout>
    </div>
  </div>

  <!-- POLICY LIST -->
  <datalist id="policy-id-options">
    @for (policyId of policyIdOptions; track policyId) {
    <option [value]="policyId"></option>
    }
  </datalist>

</section>

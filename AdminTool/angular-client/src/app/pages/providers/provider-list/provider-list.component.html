<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Healthcare module</p>
      <h1>Providers</h1>
    </div>
  </header>

  @if (alertMessage) {
  <div
    class="alert"
    [ngClass]="'alert-' + alertType"
    animate.enter="alert-enter"
    animate.leave="alert-leave"
    role="alert"
  >
    {{ alertMessage }}
  </div>
  }

  <app-search-query
    [query]="gridSearchQuery"
    [placeholder]="'Search providers'"
    [showRefresh]="true"
    [refreshDisabled]="loading"
    (queryChange)="onSearchQueryChange($event)"
    (refreshClicked)="load()"
  ></app-search-query>

  <div class="card grid-card">
    <div class="card-body grid-shell">
      <app-state-layout [loading]="loading" [error]="alertMessage" [empty]="!providers.length && !loading && !alertMessage">
        <app-data-grid
          [rows]="providers"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [showSearch]="false"
          [externalSearchQuery]="gridSearchQuery"
          (gridSortChange)="onGridSortChanged($event)"
          (rowClicked)="openInsuranceForProvider($event.data)"
        ></app-data-grid>
      </app-state-layout>
    </div>
  </div>
</section>

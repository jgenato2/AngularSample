<ng-container *ngIf="loading; else contentTpl">
  <div class="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <span>Loading claim...</span>
  </div>
</ng-container>

<ng-template #contentTpl>
  <section class="page" *ngIf="claim; else emptyTpl">
    <header class="page-header">
      <div>
        <p class="eyebrow">Claims detail</p>
        <h1>{{ claim.claimId }}</h1>
        <p class="sub">{{ claim.memberName }} · {{ claim.provider }}</p>
      </div>
      <div class="actions">
        <button class="btn btn-outline-secondary" routerLink="/claims">Back</button>
        <button class="btn btn-danger" (click)="remove()" *ngIf="canManage">Delete</button>
      </div>
    </header>

    <div *ngIf="alertMessage" class="alert" [ngClass]="'alert-' + alertType" role="alert">
      {{ alertMessage }}
    </div>

    <div class="tab-strip" role="tablist" aria-label="Claim detail tabs">
      <button
        class="tab-btn"
        type="button"
        [class.active]="activeTab === 'details'"
        (click)="switchTab('details')"
      >
        Claim Details
      </button>
      <button
        class="tab-btn"
        type="button"
        [class.active]="activeTab === 'audit'"
        (click)="switchTab('audit')"
      >
        Audit Log
      </button>
    </div>

    <ng-container *ngIf="activeTab === 'details'">
      <div class="card detail-card">
        <form class="form-grid" (ngSubmit)="save()" #detailForm="ngForm">
        <div>
          <label class="form-label">Policy ID</label>
          <input class="form-control" list="policy-id-options" name="policyId" [(ngModel)]="formModel.policyId" [disabled]="!canManage" required />
          <a class="policy-link" [routerLink]="['/insurance', formModel.policyId]" *ngIf="formModel.policyId">Open insurance detail</a>
        </div>

        <div>
          <label class="form-label">Member Name</label>
          <input class="form-control" name="memberName" [(ngModel)]="formModel.memberName" [disabled]="!canManage" required />
        </div>

        <div>
          <label class="form-label">Provider</label>
          <input class="form-control" name="provider" [(ngModel)]="formModel.provider" [disabled]="!canManage" required />
        </div>

        <div>
          <label class="form-label">Claim Type</label>
          <select class="form-select status-select" name="claimType" [(ngModel)]="formModel.claimType" [disabled]="!canManage" required>
            <option value="Outpatient">Outpatient</option>
            <option value="Inpatient">Inpatient</option>
            <option value="Emergency">Emergency</option>
            <option value="Pharmacy">Pharmacy</option>
          </select>
        </div>

        <div>
          <label class="form-label">Service Category</label>
          <input class="form-control" name="serviceCategory" [(ngModel)]="formModel.serviceCategory" [disabled]="!canManage" required />
        </div>

        <div>
          <label class="form-label">Diagnosis Code</label>
          <input class="form-control" name="diagnosisCode" [(ngModel)]="formModel.diagnosisCode" [disabled]="!canManage" required />
        </div>

        <div>
          <label class="form-label">Submitted At</label>
          <input type="date" class="form-control" name="submittedAt" [(ngModel)]="formModel.submittedAt" [disabled]="!canManage" required />
        </div>

        <div>
          <label class="form-label">Service Date</label>
          <input type="date" class="form-control" name="serviceDate" [(ngModel)]="formModel.serviceDate" [disabled]="!canManage" required />
        </div>

        <div>
          <label class="form-label">Claim Amount</label>
          <div class="input-group money-input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control money-input" name="claimAmount" [(ngModel)]="formModel.claimAmount" min="0" step="0.01" inputmode="decimal" [disabled]="!canManage" required />
          </div>
        </div>

        <div>
          <label class="form-label">Status</label>
          <button
            type="button"
            class="btn status-trigger"
            [disabled]="!canManage || saving"
            (click)="openStatusModal()"
            [ngClass]="statusTagClass(formModel.status)"
          >
            {{ formModel.status || 'Select status' }}
          </button>
        </div>

        <div class="full-row">
          <label class="form-label">Notes</label>
          <textarea class="form-control" name="notes" rows="3" [(ngModel)]="formModel.notes" [disabled]="!canManage"></textarea>
        </div>

          <div class="full-row actions" *ngIf="canManage">
            <button class="btn btn-primary" type="submit" [disabled]="detailForm.invalid || saving">
              {{ saving ? "Saving..." : "Save" }}
            </button>
          </div>
        </form>
      </div>
    </ng-container>

    <ng-container *ngIf="activeTab === 'audit'">
      <app-audit-log-section [items]="auditLogs" [loading]="auditLoading"></app-audit-log-section>
    </ng-container>

    <div class="status-modal-backdrop" *ngIf="showStatusModal" (click)="closeStatusModal()"></div>
    <section class="status-modal" *ngIf="showStatusModal" role="dialog" aria-modal="true" aria-label="Select claim status">
      <header class="status-modal-header">
        <h2>Select Status</h2>
        <button type="button" class="btn-close" aria-label="Close" [disabled]="saving" (click)="closeStatusModal()"></button>
      </header>
      <div class="status-modal-body">
        <button
          *ngFor="let status of availableStatusOptions"
          type="button"
          class="btn status-choice"
          [disabled]="saving"
          [ngClass]="statusTagClass(status)"
          (click)="selectStatus(status)"
        >
          {{ status }}
        </button>
      </div>
    </section>
  </section>
</ng-template>

<datalist id="policy-id-options">
  <option *ngFor="let policyId of policyIdOptions" [value]="policyId"></option>
</datalist>

<ng-template #emptyTpl>
  <section class="page">
    <div class="card detail-card">
      <p>Claim not available.</p>
    </div>
  </section>
</ng-template>

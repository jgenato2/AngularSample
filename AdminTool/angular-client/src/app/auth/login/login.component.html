<div class="auth-shell">
  <div class="card auth-card">
    <div class="card-body">
      <div *ngIf="alertMessage" class="alert" [ngClass]="'alert-' + alertType" role="alert">
        {{ alertMessage }}
      </div>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="login-email" class="form-label">Email</label>
          <input
            id="login-email"
            class="form-control"
            formControlName="email"
            type="email"
            autocomplete="email"
          />
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label">Password</label>
          <input
            id="login-password"
            class="form-control"
            formControlName="password"
            type="password"
            autocomplete="current-password"
          />
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? "Signing in..." : "Sign in" }}
        </button>
      </form>
      <div class="hint">
        <span>Seed admin:</span>
        <strong>admin@local.com</strong> / <strong>Admin123!</strong>
      </div>
    </div>
  </div>
</div>

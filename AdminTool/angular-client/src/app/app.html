<nav class="navbar topbar navbar-expand" *ngIf="!isLoginPage">
  <div class="container-fluid">
    <div class="left-cluster">
      <div class="menu-inline" *ngIf="auth.isAuthenticated()">
        <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
          ☰
        </button>

        <div class="menu-panel" [class.open]="menuOpen" [attr.aria-hidden]="!menuOpen">
          <a class="menu-link menu-brand" routerLink="/insurance" (click)="closeMenu()">
            <span class="brand-mark"></span>
            <span>MedCover Central</span>
          </a>
          <div class="menu-group-label">Operations</div>
          <a class="menu-link" routerLink="/insurance" (click)="closeMenu()">Insurance</a>
          <a class="menu-link" routerLink="/providers" (click)="closeMenu()">Providers</a>
          <a class="menu-link" routerLink="/claims" (click)="closeMenu()">Claims</a>
          <div class="menu-group-label">Administration</div>
          <a class="menu-link" routerLink="/users" (click)="closeMenu()">Users</a>
          <a class="menu-link" routerLink="/audit-logs" (click)="closeMenu()" *ngIf="auth.isAdmin()">Audit Logs</a>
        </div>
      </div>

      <div class="brand navbar-brand">
        <span class="brand-mark"></span>
        <span class="brand-title">MedCover Central</span>
      </div>
    </div>
    <div class="ms-auto d-flex gap-2 align-items-center">
      <div class="user-menu" *ngIf="auth.isAuthenticated()" (click)="$event.stopPropagation()">
        <button
          class="user-menu-toggle"
          type="button"
          (click)="toggleUserMenu($event)"
          [attr.aria-expanded]="userMenuOpen"
        >
          <span class="user-name">{{ auth.user()?.name || "Account" }}</span>
          <span class="user-caret">▾</span>
        </button>

        <div class="user-menu-panel" *ngIf="userMenuOpen">
          <button class="user-menu-item" type="button" (click)="goToProfile()">Profile</button>
          <button class="user-menu-item danger" type="button" (click)="logout()">Logout</button>
        </div>
      </div>
      <a class="btn btn-primary" routerLink="/login" *ngIf="!auth.isAuthenticated()">Login</a>
    </div>
  </div>
</nav>

<div class="menu-backdrop" *ngIf="!isLoginPage && menuOpen" (click)="closeMenu()"></div>

<main class="app-shell">
  <router-outlet></router-outlet>
</main>

name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - feature/**
      - bugfix/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AdminTool/angular-client/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Angular dependencies
        working-directory: AdminTool/angular-client
        run: npm ci

      - name: Build Angular
        working-directory: AdminTool/angular-client
        run: npm run build -- --configuration production

      - name: Restore .NET
        run: dotnet restore AdminTool/server/server.csproj

      - name: Build .NET
        run: dotnet build AdminTool/server/server.csproj -c Release --no-restore

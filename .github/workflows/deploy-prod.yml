name: Deploy Production

on:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/admintool

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./AdminTool
          file: ./AdminTool/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context (production)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP_PROD }}
          cluster-name: ${{ vars.AKS_CLUSTER_PROD }}

      - name: Deploy manifests
        run: |
          kubectl apply -f AdminTool/k8s/namespace.yaml
          kubectl apply -f AdminTool/k8s/deployment.yaml
          kubectl apply -f AdminTool/k8s/service.yaml
          kubectl apply -f AdminTool/k8s/cluster-issuer.yaml || true
          kubectl apply -f AdminTool/k8s/ingress.yaml
          kubectl -n admintool set image deployment/admintool admintool=${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl -n admintool rollout status deployment/admintool --timeout=180s
